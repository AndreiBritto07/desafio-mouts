
name: Cypress - Desafio QA

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar testes do desafio
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/features/desafio.feature

      - name: Salvar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
